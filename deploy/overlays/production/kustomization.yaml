apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Managed by the pipeline: promote-production (and rollback-production) rewrite VERSION and every newTag
# to the commit's short SHA; ArgoCD app quickcart-production syncs this directory.
namespace: quickcart-production

resources:
  - ../../base

configMapGenerator:
  - name: release
    literals:
      - STAGE=production
      - VERSION=initial

images:
  - name: workshop/frontend
    newTag: initial
  - name: workshop/order-service
    newTag: initial
  - name: workshop/payment-service
    newTag: initial
  - name: workshop/inventory-service
    newTag: initial
  - name: workshop/notification-service
    newTag: initial
