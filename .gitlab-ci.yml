# QuickCart — a change goes to production only if Dynatrace says it's good.
#
#   merge to main ─► build ─► deploy-staging (ArgoCD) + deployment event
#                 ─► quality-gate: the staging deployment event triggers the
#                    Site Reliability Guardian workflow in Dynatrace; on FAIL
#                    Dynatrace starts this pipeline with ROLLBACK=true and
#                    staging goes back to the previous version. This job waits
#                    for the verdict and comments it on the merge request.
#                 ─► promote-production (ArgoCD), only on PASS
#
# The guardian and the workflow are created per VM by the aiops-lab Terraform
# (dt-exercise.tf) — this pipeline never touches the Dynatrace configuration.
#
# GitOps: images are built into the node's containerd (tag = short commit
# SHA); the pipeline rewrites deploy/overlays/<stage>/kustomization.yaml on
# main ([skip ci]) and ArgoCD (quickcart-staging / quickcart-production) syncs.

variables:
  ROLLBACK:
    value: "false"
    options: ["false", "true"]
    description: "true = roll an environment back to its previous version (set by the Dynatrace quality-gate workflow on FAIL)"
  ROLLBACK_STAGE:
    value: "staging"
    options: ["staging", "production"]
    description: "Environment to roll back"
  # Version to roll back FROM; if the stage no longer runs it, nothing happens
  # (Dynatrace can fire the workflow twice for one deployment).
  ROLLBACK_FROM_VERSION: ""
  ROLLBACK_REASON: ""
  DT_VALIDATION_URL: ""
  RELEASE_PRODUCT: quickcart-demo
  STAGING_NAMESPACE: quickcart-staging
  PRODUCTION_NAMESPACE: quickcart-production
  GATE_SERVICE: payment-service

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [build, staging, quality-gate, production, rollback]

default:
  tags: [self-hosted]
  before_script:
    - source ci/lib.sh

# Release: every push (merge) to main that changes the app or its manifests,
# or a manual "Run pipeline" on main.
.release:
  rules:
    - if: $ROLLBACK == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: [services/**/*, deploy/base/**/*]
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/

build:
  stage: build
  extends: .release
  script:
    - |
      for svc in ${SERVICES}; do
        log "Building workshop/${svc}:${CI_COMMIT_SHORT_SHA}"
        docker build -q -t "workshop/${svc}:${CI_COMMIT_SHORT_SHA}" "services/${svc}/"
        docker save "workshop/${svc}:${CI_COMMIT_SHORT_SHA}" | k3s ctr images import - >/dev/null
      done

deploy-staging:
  stage: staging
  extends: .release
  environment:
    name: staging
    url: https://staging.${WORKSHOP_IP}.nip.io
  script:
    - load_mr_context
    - |
      SHA="$(gitops_release staging "${CI_COMMIT_SHORT_SHA}" "deploy: staging ${CI_COMMIT_SHORT_SHA}")"
    - argocd_sync_wait staging "${SHA}"
    - date -u +%s > staging-deployed-at
    - dt_deployment_events staging "${CI_COMMIT_SHORT_SHA}" deploy
  artifacts:
    paths: [staging-deployed-at]
    expire_in: 1 day

quality-gate:
  stage: quality-gate
  extends: .release
  script:
    - load_mr_context
    - log "Dynatrace validates staging (traffic soak + Site Reliability Guardian) — waiting for the verdict..."
    - |
      RESULT=0
      python3 -u ci/dt.py gate --workflow-title "workshop-aiops-lab ${K8_CLUSTER} ${GATE_SERVICE} quality gate" \
        --service "${GATE_SERVICE}" --version "${CI_COMMIT_SHORT_SHA}" \
        --deployed-at "$(cat staging-deployed-at)" --report gate-report.md || RESULT=1
      if [ "${RESULT}" = 0 ]; then
        echo "**Passed — promoting ${CI_COMMIT_SHORT_SHA} to production.**" >> gate-report.md
      else
        echo "**Failed — production was not touched.**" >> gate-report.md
      fi
      if [ -n "${MR_IID}" ]; then mr_note "${MR_IID}" gate-report.md; fi
      exit "${RESULT}"
  artifacts:
    when: always
    paths: [gate-report.md]
    expire_in: 1 week

promote-production:
  stage: production
  extends: .release
  environment:
    name: production
    url: https://shop.${WORKSHOP_IP}.nip.io
  script:
    - load_mr_context
    - |
      SHA="$(gitops_release production "${CI_COMMIT_SHORT_SHA}" "deploy: production ${CI_COMMIT_SHORT_SHA}")"
    - argocd_sync_wait production "${SHA}"
    - dt_deployment_events production "${CI_COMMIT_SHORT_SHA}" deploy

# Started by Dynatrace (quality-gate workflow) — or manually with ROLLBACK=true.
rollback:
  stage: rollback
  rules:
    - if: $ROLLBACK == "true"
  environment:
    name: $ROLLBACK_STAGE
  script:
    - |
      STAGE="${ROLLBACK_STAGE:-staging}"
      git fetch -q origin "${CI_DEFAULT_BRANCH}"
      FILE="deploy/overlays/${STAGE}/kustomization.yaml"
      CURRENT="$(overlay_version "${STAGE}" "origin/${CI_DEFAULT_BRANCH}")"
      if [ -n "${ROLLBACK_FROM_VERSION}" ] && [ "${ROLLBACK_FROM_VERSION}" != "${CURRENT}" ]; then
        log "${STAGE} no longer runs ${ROLLBACK_FROM_VERSION} (now ${CURRENT}) — already rolled back, nothing to do."
        exit 0
      fi
      # Versions an earlier rollback moved away from are known-bad: skip them.
      BAD=" $(git log --format=%s --grep="^rollback: ${STAGE} " "origin/${CI_DEFAULT_BRANCH}" | awk '{print $3}' | tr '\n' ' ') "
      PREVIOUS=""
      for c in $(git log --format=%H "origin/${CI_DEFAULT_BRANCH}" -- "${FILE}"); do
        v="$(overlay_version "${STAGE}" "${c}")"
        if [ -n "${v}" ] && [ "${v}" != "${CURRENT}" ] && [[ "${BAD}" != *" ${v} "* ]]; then PREVIOUS="${v}"; break; fi
      done
      if [ -z "${PREVIOUS}" ]; then
        echo "No earlier ${STAGE} version than ${CURRENT} — nothing to roll back to."
        exit 1
      fi
      REASON="${ROLLBACK_REASON:-manual rollback}"
      log "Rolling ${STAGE} back: ${CURRENT} -> ${PREVIOUS} (${REASON})"
      # The version IS the short SHA of the merge that shipped it
      load_mr_context "$(git rev-parse -q --verify "${CURRENT}^{commit}" || echo "${CI_COMMIT_SHA}")"
    - |
      SHA="$(gitops_release "${STAGE}" "${PREVIOUS}" "rollback: ${STAGE} ${CURRENT} -> ${PREVIOUS} (${REASON})")"
    - argocd_sync_wait "${STAGE}" "${SHA}"
    - |
      EXTRA="$(python3 -c 'import json,sys; print(json.dumps({k: v for k, v in {"rollback.from_version": sys.argv[1], "rollback.reason": sys.argv[2], "dt.validation.url": sys.argv[3]}.items() if v}))' "${CURRENT}" "${REASON}" "${DT_VALIDATION_URL}")"
      dt_deployment_events "${STAGE}" "${PREVIOUS}" rollback "${EXTRA}"
    - |
      if [ -n "${MR_IID}" ]; then
        {
          echo "### ↩️ ${STAGE} rolled back: \`${CURRENT}\` → \`${PREVIOUS}\`"
          echo
          echo "Triggered by Dynatrace — ${REASON}."
          [ -n "${DT_VALIDATION_URL}" ] && echo "[Guardian validation](${DT_VALIDATION_URL}) · "
          echo "[Rollback pipeline](${CI_PIPELINE_URL})"
        } > rollback-note.md
        mr_note "${MR_IID}" rollback-note.md
      fi
